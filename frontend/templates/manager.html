<div class="container-fluid my-4">
    <!-- Sidebar -->
    <div class="row align-items-start">
        <div class="col-3">
            <div class="list-group m-3">

                <a href="{% url 'assignemployees' %}" class="list-group-item list-group-item-action">Employees</a>
                <a href="{% url 'attendance' %}" class="list-group-item list-group-item-action">Attendance</a>

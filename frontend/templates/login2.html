<!-- your_app/templates/login.html -->

{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block link %}
<link rel="stylesheet" href="{% static 'css/registration.css' %}">
{% endblock link %}

{% block content2 %}

<div class="d-flex justify-content-center mt-4">
    <h1>Login</h1>
</div>

<div class="container alert alert-warning alert-dismissible fade show" style="display:none" role="alert" id="message">
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="main-w3layouts wrapper">
    <div class="main-agileinfo">
        <div class="agileits-top">
           
            <form action="#" method="post" id="loginForm">
              {% csrf_token %}
              <input class="text" type="text" name="username" placeholder="Username" id="username" required="">
              
              <input class="text" style="margin-top:18px;" type="password" name="password" placeholder="Password" id="password" required=""><br>
             
             
              <input type="submit" value="LOGIN" id="loginBtn" >
          </form>
            <p>Don't have an Account? <a href="{% url 'registration' %}">Register Now!</a></p>
        </div>
    </div>
    <!-- //copyright -->
    <ul class="colorlib-bubbles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</div>
{% endblock  %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
  
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        axios({
            method: 'post',
            url: '/graphql/',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
            },
            data: {
                query: `
                    mutation {
                        login(username: "${username}", password: "${password}") {
                            accessToken
                            refreshToken
                            success
                            payload
                        }
                    }
                `
            }
        })
        .then(response => {
            const data = response.data;
            console.log('----data-----',data);
            

            if (data.errors) {
                console.error("Login failed:", data.errors);
                // Display error message to user
                const messageBox = document.getElementById('message');
                messageBox.style.display = 'block';
                messageBox.innerText = "Login failed. Please check your credentials and try again.";
            } else {
                const success = data.data.login.success;
                const message = data.data.login.message;

                if (success) {
                    console.log("Login successful!");

                    // Optionally display a success message
                    const messageBox = document.getElementById('message');
                    messageBox.style.display = 'block';
                    messageBox.classList.remove('alert-warning');
                    messageBox.classList.add('alert-success');
                    messageBox.innerText = message;

                    window.location.href='/d'

                    // Redirect to dashboard after a short delay to allow message display
                    // setTimeout(() => {
                    //     window.location.href = '/d';  // Update with your dashboard URL
                    // }, 1000);
                } else {
                    console.error("Login failed:", message);
                    // Display error message to user
                    const messageBox = document.getElementById('message');
                    messageBox.style.display = 'block';
                    messageBox.innerText = message || "Login failed. Please try again.";
                }
            }
        })
        .catch(error => {
            console.error("Error during login:", error);
            // Display generic error message
            const messageBox = document.getElementById('message');
            messageBox.style.display = 'block';
            messageBox.innerText = "An unexpected error occurred. Please try again later.";
        });
    });
</script>
{% endblock %}
